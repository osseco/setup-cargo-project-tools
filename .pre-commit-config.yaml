repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs

  # Tools are expected on PATH (see AGENTS.md).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
      - id: unit-tests
        name: unit tests
        entry: bash test/run.sh
        language: system
        files: ^(src/|scripts/|test/run\.sh$|cargo-project-tools\.(version|sha256)$|README\.md$)
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor --offline .
        language: system
        files: ^(\.github/(workflows/|dependabot\.yml$)|action\.yml$)
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint -config-file .github/actionlint.yaml
        language: system
        files: ^\.github/(workflows/|actionlint\.yaml$)
        pass_filenames: false
      - id: version-rules
        name: version rules self-check
        entry: bash .github/calculate-version.sh --self-check
        language: system
        files: ^\.github/calculate-version\.sh$
        pass_filenames: false
